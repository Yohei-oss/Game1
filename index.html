<!DOCTYPE html>
<meta charset="utf-8">
<title>公開バージョンのYON POKER</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Luckiest+Guy&family=Mochiy+Pop+One&display=swap">
<style>
/* 画面いっぱいがオリーブのフェルト卓（PROBE POKER と同じ見た目）。
   左右に使い込んだ革の手すり（上下の手すりと丸い角はやめた） */
:root {
  color-scheme: dark;
  --felt: #727a5e;
  --felt-dark: rgba(53,58,40,.16);
  --felt-light: rgba(150,162,118,.14);
  --rail-w: 32px;
}
html, body { height: 100%; }
/* 続けてクリックしたときに、カードやチップが文字や画像として選ばれて青くなる・ドラッグでつかめる、のをふせぐ */
html, body, body * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
img, svg { -webkit-user-drag: none; user-drag: none; }
::selection { background: transparent; }
body {
  margin: 0; overflow: hidden;
  background:
    radial-gradient(circle at 18% 22%, var(--felt-dark) 0 6%, transparent 14%),
    radial-gradient(circle at 82% 68%, rgba(53,58,40,.12) 0 5%, transparent 12%),
    radial-gradient(circle at 64% 12%, var(--felt-light) 0 4%, transparent 10%),
    var(--felt);
}
.rail { position: fixed; pointer-events: none; z-index: 5; }
/* 左右：PROBE POKER と同じ縦の手すり（右は左右反転して継ぎ目をずらす） */
.rail.left, .rail.right { top: 0; bottom: 0; width: var(--rail-w);
  background: url(rail-l.webp) left top / var(--rail-w) 640px repeat-y; }
.rail.left { left: 0; }
.rail.right { right: 0; transform: scaleX(-1); background-image: url(rail-r.webp); background-position: left 220px; }

/* ---- 仮のカード（並びを見るためのもの。絵柄はまだ決めていない） ---- */
:root {
  --ink: #141414; --paper: #fbf7ec; --chip: 64px; }
.row { position: fixed; left: 0; right: 0; display: flex; justify-content: center; gap: var(--gap); z-index: 2;
  /* 自分の手札・場のカード：PROBE POKER Ver1.2 の手札（幅 clamp(64px, 17vw, 112px)）の約1.15倍。5:7、間 clamp(4px, 1.6vw, 14px) */
  --cw: clamp(74px, 19.5vw, 128px); --ch: calc(var(--cw) * 1.4); --gap: clamp(4px, 1.6vw, 14px); }
.row.opp { top: 12px; --cw: clamp(55px, 13.8vw, 90px); --gap: clamp(4px, 1.4vw, 10px); }   /* 相手の手札：PROBE POKER Ver1.2 の .opp（clamp(48px, 12vw, 78px)）の約1.15倍 */
.row.board { top: 50%; transform: translateY(-50%); }
.row.mine { bottom: 63px; }   /* 自分の手札：PROBE POKER Ver1.2 と同じ高さ（下から 63px） */
.card { width: var(--cw); height: var(--ch); box-sizing: border-box; border-radius: 8px;
  border: 1.5px solid var(--ink); background: var(--paper); position: relative;   /* 細い黒いふち */
  box-shadow: 0 4px 0 rgba(0,0,0,.25); font-family: "Luckiest Guy", "Mochiy Pop One", sans-serif; color: var(--ink); }
.card.back { background: #ece6d6 url(back.webp) center / cover no-repeat; }   /* 裏面の絵（石のメダルと3色の帯） */
/* カードの中：背景の絵＋数字の石の絵（2:3 の絵を 5:7 のカードいっぱいに、真ん中を基準に切って入れる） */
.card { overflow: hidden; }
.card img.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }

/* ブルーチップの山（場の2枚の左と右）。PROBE POKER のチップと同じ絵 */
.hand { position: relative; display: flex; gap: var(--gap); }
.chips { position: fixed; z-index: 3; width: var(--chip); height: calc(var(--chip) * (.86 + .13 * 7));
  --cw: clamp(74px, 19.5vw, 128px); --chip: min(calc(var(--cw) * .5), 58px); }
/* 大きさ：場のカードの幅×0.5、最大 58px（PROBE POKER Ver1.2 の黄色いチップ（×0.62、最大 72px）より少し小さく）。
   置き場所：自分の山は場の2枚と自分の手札の真ん中の高さで、手札の左の外。相手の山は場の2枚と相手の手札の真ん中の高さで、横は自分の山を画面の真ん中で折り返した位置（左右対称）（スクリプトの placeChips が決める） */
.chips .chip { position: absolute; left: 0; width: var(--chip); height: calc(var(--chip) * .86); }
.chips .chip svg { width: 100%; height: 100%; display: block; overflow: visible; }

.toss-chip { position: fixed; pointer-events: none; }
.toss-chip svg { width: 100%; display: block; overflow: visible; }
.cb-cnt span { font-family: "Luckiest Guy", sans-serif; font-size: var(--fs); }
.dealer { position: fixed; z-index: 9; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
.dealer[hidden] { display: none; }
.dealer svg { width: 100%; display: block; overflow: visible; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
.dealer span { margin-top: 3px; font: 11px "Mochiy Pop One", sans-serif; color: var(--paper); -webkit-text-stroke: .25em var(--ink); paint-order: stroke fill; opacity: 0; transition: opacity .2s; white-space: nowrap; }
.dealer.set span { opacity: 1; }
.dealer.moving span { opacity: 0; transition: none; }   /* 動いている間は「センテ」の文字を消す（着いたら出る） */
.dealer.set { z-index: 2; }   /* 置いたあとは青い山より奥（山が高く積まれたら、山の後ろに隠れる） */
.dealer.opp { flex-direction: column-reverse; }   /* 相手の側は点対称：「センテ」の文字はチップの上 */
.dealer.opp span { margin: 0 0 3px; }
.gauge { position: fixed; z-index: 9; left: 44px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
.g-bar { width: 14px; height: min(42vh, 300px); display: flex; flex-direction: column; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.g-bar i { display: block; min-height: 0; transition: flex-grow .35s ease; }
.g-o { background: #ff8a7a; } .g-t { background: rgba(20,20,20,.25); } .g-m { background: #B6F23A; }
.g-n { font: 15px "Luckiest Guy", sans-serif; color: #fff; -webkit-text-stroke: .18em var(--ink); paint-order: stroke fill; min-width: 2ch; text-align: center; }
.g-n.low { color: #ff5a4a; animation: lowBlink 1s steps(2) infinite; }
@keyframes lowBlink { 50% { opacity: .45; } }
.pile-tag { position: fixed; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .2s; min-width: 26px; box-sizing: border-box; padding: 2px 6px; text-align: center;
  font: 14px "Luckiest Guy", sans-serif; color: #fff; -webkit-text-stroke: .18em var(--ink); paint-order: stroke fill; background: rgba(20,20,20,.35); border: 2px solid var(--ink); border-radius: 999px; }
.pile-tag.show { opacity: 1; }
.round-pill { position: fixed; z-index: 10; left: 44px; top: 12px; min-width: 64px; min-height: 44px; display: flex; align-items: center; justify-content: center; text-align: center; box-sizing: border-box;
  font: 16px "Luckiest Guy", sans-serif; letter-spacing: .04em; color: var(--paper); background: rgba(20,20,20,.35);
  border: 2px solid var(--ink); border-radius: 999px; padding: 4px 10px; -webkit-text-stroke: .18em var(--ink); paint-order: stroke fill; }
/* 試合中のセッテイのボタン：「1 / 7」のすぐ下（同じ形の板） */
.game-set { position: fixed; z-index: 10; left: 44px; top: 64px; min-width: 64px; min-height: 36px; box-sizing: border-box; padding: 0 12px; cursor: pointer;
  font: 12px "Mochiy Pop One", sans-serif; color: var(--paper); background: rgba(20,20,20,.55); border: 2px solid var(--ink); border-radius: 999px;
  -webkit-text-stroke: .2em var(--ink); paint-order: stroke fill; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.game-set:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.game-set:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
/* ハンド（役の一覧）のタブ：相手の青いチップの山の真上の列（横の真ん中をそろえる）、高さは相手の手札の真ん中。
   置き場所はスクリプトの placeTab が決める。押すと下に一覧が開く */
.hand-tab { position: fixed; z-index: 10; top: 12px; left: 0;
  min-height: 44px; font: 14px "Mochiy Pop One", sans-serif; color: var(--paper);
  background: #4a4744; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  -webkit-text-stroke: .2em var(--ink); paint-order: stroke fill; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.hand-tab[aria-expanded="true"] { background: #c9a227; }
.hand-tab:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.hand-tab:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.hand-panel { position: fixed; z-index: 20; top: 64px; right: 44px; width: min(390px, calc(100vw - 88px)); max-height: calc(100vh - 80px); overflow: auto;
  box-sizing: border-box; padding: 10px 12px; background: #f6f0e0; color: var(--ink); border: 3px solid var(--ink); border-radius: 14px;
  box-shadow: 0 6px 0 rgba(0,0,0,.3); font: 13px "Mochiy Pop One", sans-serif; }
.hand-panel[hidden] { display: none; }
.hand-panel h2 { margin: 0 0 6px; font-size: 14px; }
.hand-panel ol { list-style: none; margin: 0; padding: 0; }
.hand-panel li { display: grid; grid-template-columns: 16px 1fr auto; grid-template-rows: auto auto; column-gap: 6px; align-items: center; padding: 4px 0; border-top: 1.5px dashed rgba(20,20,20,.25); }
.hand-panel li:first-child { border-top: 0; }
.hand-panel .no { grid-row: span 2; font: 15px "Luckiest Guy", sans-serif; line-height: 1.3; }
.hand-panel .nm { font-size: 13px; }
.hand-panel .ds { font-size: 10px; color: #4a4744; grid-column: 2; }
.hand-panel .nm { grid-column: 2; }
.hand-panel .ex { grid-column: 3; grid-row: 1 / span 2; }
.hand-panel .ex { display: flex; gap: 3px; }
.hand-panel .ex b { width: 18px; height: 24px; display: grid; place-items: center; border: 1.5px solid var(--ink); border-radius: 4px;
  font: 14px "Luckiest Guy", sans-serif; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.hand-panel .ex .r { background: #e0574a; } .hand-panel .ex .b { background: #4a86d8; } .hand-panel .ex .g { background: #4fae5a; }
.hand-panel .ex { align-items: center; }
.hand-panel .ex i { font-style: normal; font-size: 11px; margin: 0 1px; }
.hand-panel .ex .bd { display: flex; gap: 3px; padding: 2px; border-radius: 6px; background: rgba(20,20,20,.12); }   /* 真ん中の2枚（どの役でも同じ） */
.hand-panel .ex em { font-style: normal; font-size: 11px; color: #8a8478; }
.hand-panel .note { margin: 6px 0 0; font-size: 10.5px; color: #4a4744; }
/* タイトルの場面：真ん中に「YON POKER」の文字、「4」のカード3枚、その下にボタン */
.title-scr .t-warm { position: fixed; left: 0; bottom: 0; width: clamp(74px, 19.5vw, 128px); height: calc(clamp(74px, 19.5vw, 128px) * 1.4); opacity: .01; pointer-events: none; z-index: -1; }
.title-scr .t-warm img { position: absolute; inset: 0; border: 0; box-shadow: none; }   /* 25枚を同じ場所に重ねる（画面の外だと描かれないので） */
.title-scr { position: fixed; inset: 0; z-index: 40; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 3.5vh, 30px); }
.title-scr .t-logo { margin: 0; font: clamp(46px, 11vw, 104px) "Luckiest Guy", sans-serif; letter-spacing: .04em; line-height: 1; color: #fff; white-space: nowrap;
  -webkit-text-stroke: .1em var(--ink); paint-order: stroke fill; text-shadow: 0 .07em 0 rgba(0,0,0,.45); opacity: 0; }
.title-scr .t-logo span { color: #ffe36a; }
.title-scr .t-cards { display: flex; gap: clamp(8px, 2vw, 16px); --cw: clamp(68px, 16vw, 116px); --ch: calc(var(--cw) * 1.4); }
.title-scr .t-slot { position: relative; width: var(--cw); height: var(--ch); }
.title-scr .t-slot .card { position: absolute; inset: 0; }
.title-scr .t-btns { display: grid; grid-template-columns: repeat(2, minmax(130px, 1fr)); gap: 12px 14px; }
.t-btn { position: relative; pointer-events: auto; font: 16px "Mochiy Pop One", sans-serif; color: var(--paper); background: #4a4744; border: 3px solid var(--ink);
  border-radius: 999px; padding: 0 22px; min-height: 48px; cursor: pointer; -webkit-text-stroke: .2em var(--ink); paint-order: stroke fill; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.t-btn.go { background: #c9a227; font-size: 19px; }
.t-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.t-btn:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.t-btn.off { filter: saturate(.3) brightness(.75); cursor: not-allowed; }   /* PvP：まだ遊べない */
.t-btn.off:active { transform: none; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.t-btn .t-soon { position: absolute; top: -11px; right: -8px; font-size: 9.5px; color: var(--ink); -webkit-text-stroke: 0; background: #ffe36a; border: 2px solid var(--ink);
  border-radius: 999px; padding: 1px 7px; white-space: nowrap; transform: rotate(6deg); }
/* ルール・セッテイの板（「ハンド」の一覧と同じ板） */
.title-panel { z-index: 55; }
.title-panel h3 { margin: 12px 0 4px; font-size: 13px; padding: 2px 8px; background: #fff1a8; border: 2px solid var(--ink); border-radius: 8px; }
.title-panel p { margin: 4px 0; font-size: 11.5px; line-height: 1.65; }
.title-panel .t-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; font-size: 14px; }
.title-panel .t-tog { display: flex; gap: 6px; }
.title-panel .t-tog button { font: 14px "Mochiy Pop One", sans-serif; min-width: 64px; min-height: 40px; border: 3px solid var(--ink); border-radius: 999px; background: #e6dfcc; color: var(--ink); cursor: pointer; }
.title-panel .t-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.title-panel .t-head h2 { margin: 0; }
.title-panel .t-x { font: 12px "Mochiy Pop One", sans-serif; color: var(--paper); background: #4a4744; border: 2px solid var(--ink); border-radius: 999px;
  min-height: 32px; padding: 0 12px; cursor: pointer; -webkit-text-stroke: .2em var(--ink); paint-order: stroke fill; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.title-panel .t-x:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.title-panel .t-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.title-panel .t-tabs button { flex: 1; font: 13px "Mochiy Pop One", sans-serif; min-height: 36px; border: 2px solid var(--ink); border-radius: 10px; background: #e6dfcc; color: var(--ink); cursor: pointer; }
.title-panel .t-tabs button[aria-selected="true"] { background: #c9a227; color: var(--paper); -webkit-text-stroke: .2em var(--ink); paint-order: stroke fill; }
.title-panel .t-page[hidden] { display: none; }
.title-panel .t-deck { display: grid; gap: 6px; margin: 8px 0; }
.title-panel .t-deck-row { display: grid; grid-template-columns: 22px repeat(8, 1fr); gap: 3px; align-items: center; }
.title-panel .t-deck-row img { width: 100%; aspect-ratio: 5 / 7; object-fit: cover; border: 1.5px solid var(--ink); border-radius: 4px; display: block; }
.title-panel .t-deck-c { display: grid; place-items: center; height: 22px; border: 1.5px solid var(--ink); border-radius: 6px; font-size: 11px; color: #fff; -webkit-text-stroke: .2em var(--ink); paint-order: stroke fill; }
.title-panel .t-deck-c.r { background: #e0574a; } .title-panel .t-deck-c.b { background: #4a86d8; } .title-panel .t-deck-c.g { background: #4fae5a; }
.title-panel .t-page h3:first-child { margin-top: 0; }
.title-panel .t-stat { display: flex; justify-content: space-around; margin: 8px 0 4px; padding: 6px 4px; background: #fff8d0; border: 2px solid var(--ink); border-radius: 10px; text-align: center; font-size: 11px; }
.title-panel .t-stat b { display: block; font: 22px "Luckiest Guy", sans-serif; line-height: 1.1; }
.title-panel .t-sub { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; margin: 6px 0; }
.title-panel .t-sub .t-x { min-height: 30px; font-size: 11px; }
.title-panel .t-ver { margin: 12px 0 0; text-align: right; font-size: 10px; color: #8a8478; }
.title-panel .t-acts { display: grid; gap: 10px; margin-top: 14px; }
.title-panel .t-acts .rs-ok { margin: 0 auto; min-width: 200px; }
.title-panel .t-acts .danger { background: #c9361f; }
.title-panel .t-acts .dark { background: #4a4744; }
.title-panel .t-ask { margin: 12px 0 4px; text-align: center; font-size: 14px; }
.title-panel .t-acts.two { grid-template-columns: 1fr 1fr; }
.title-panel .t-acts.two .rs-ok { min-width: 0; width: 100%; }
.title-panel .t-tog button[aria-pressed="true"] { background: #6b9be0; color: var(--paper); -webkit-text-stroke: .2em var(--ink); paint-order: stroke fill; }
/* 試合の結果の表（「ハンド」の一覧と同じ板）：持ち数対決のあと、右からすべってくる */
.result-panel { z-index: 50; }
.result-panel .rs-big { margin: 2px 0 6px; text-align: center; font: 46px "Luckiest Guy", sans-serif; letter-spacing: .03em; line-height: 1.05;
  -webkit-text-stroke: .12em var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
.result-panel .rs-big.win { color: #B6F23A; } .result-panel .rs-big.lose { color: #ff8a7a; } .result-panel .rs-big.draw { color: #ffe36a; }
.result-panel .rs-sum { margin: 0 0 8px; padding: 6px 8px; background: #fff8d0; border: 2px solid var(--ink); border-radius: 10px; font-size: 11.5px; line-height: 1.7; }
.result-panel .rs-sum b { font: 15px "Luckiest Guy", sans-serif; }
.result-panel li { grid-template-columns: 22px 1fr auto; }
.result-panel .rs-r { font-style: normal; font-size: 9.5px; color: #fff; border: 1.5px solid var(--ink); border-radius: 999px; padding: 0 5px; margin-left: 5px; vertical-align: 1px; white-space: nowrap; }
.result-panel .rs-r.w { background: #5aa832; } .result-panel .rs-r.l { background: #c9361f; } .result-panel .rs-r.d { background: #8a8478; }
.result-panel .rs-ok, .title-panel .rs-ok { display: block; margin: 10px auto 2px; font: 16px "Mochiy Pop One", sans-serif; color: var(--paper); background: #c9a227; border: 3px solid var(--ink);
  border-radius: 999px; padding: 0 22px; min-height: 48px; min-width: 150px; cursor: pointer; -webkit-text-stroke: .2em var(--ink); paint-order: stroke fill; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.result-panel .rs-ok:active, .title-panel .rs-ok:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.result-panel .rs-ok:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* カードを選ぶ：手札3枚から2枚。触れると浮いて黄色く光る。2枚選ぶと残りの1枚が暗く沈み、「ケッテイ」が出る */
.hand .card { transition: transform .22s cubic-bezier(.2,.9,.3,1.3), box-shadow .22s, filter .25s; }
.hand.picking .card { cursor: pointer; }
.hand.picking .card:not(.sel):hover { transform: translateY(-7px); }
.hand .card.sel { transform: translateY(-20px);
  box-shadow: 0 0 0 3px #ffe36a, 0 0 18px 5px rgba(255,227,106,.65), 0 12px 16px rgba(0,0,0,.45); }
.hand.full .card:not(.sel) { filter: brightness(.5) saturate(.6); transform: translateY(6px); }
/* ケッテイしたら、浮いていたカードも暗く沈んだカードも元の位置・明るさに戻ってから焼ける */
.hand.done .card, .hand.done.full .card:not(.sel) { transform: none; filter: none; box-shadow: 0 4px 0 rgba(0,0,0,.25);
  transition: transform .55s cubic-bezier(.3,.6,.3,1), box-shadow .55s, filter .55s; }   /* 戻るときは少しゆっくり */
.decide { position: fixed; z-index: 10; transform: translateY(-50%) scale(.6); opacity: 0; pointer-events: none;
  font: 16px "Mochiy Pop One", sans-serif; color: var(--paper); background: #c9a227; border: 3px solid var(--ink);
  border-radius: 999px; padding: 0 22px; min-height: 48px; min-width: 120px; cursor: pointer; -webkit-text-stroke: .2em var(--ink); paint-order: stroke fill;
  box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .25s cubic-bezier(.2,.9,.3,1.4), opacity .2s; }
.decide.show { transform: translateY(-50%) scale(1); opacity: 1; pointer-events: auto; }
.decide:active { transform: translateY(-50%) translateY(2px) scale(1); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.decide:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.pick-hint { position: fixed; z-index: 10; transform: translate(-50%, -100%); margin: 0; pointer-events: none;
  font: 14px "Mochiy Pop One", sans-serif; color: var(--paper); -webkit-text-stroke: .24em var(--ink); paint-order: stroke fill;
  white-space: nowrap; opacity: 0; transition: opacity .3s; }
.pick-hint.show { opacity: 1; }

<!-- 相手の手札3枚（伏せている）・場の2枚・自分の手札3枚。数字とマークは仮 -->
<div class="row opp"><div class="card back"></div><div class="card back"></div><div class="card back"></div></div>
<div class="row board" id="board"></div>
<div class="row mine" id="mine"></div>

<script>
(() => {
  // マーク：△（3本）・□（4本）・☆（5本）
  const MARK = {
    tri:  '<path d="M50 8 L94 88 L6 88 Z"/>',
    sq:   '<rect x="10" y="10" width="80" height="80"/>',
    star: '<path d="M50 4 L61 38 L97 38 L68 59 L79 94 L50 73 L21 94 L32 59 L3 38 L39 38 Z"/>',
  };
  // カード：中に背景＋数字の石の絵（art/<色>-<数字>.webp）。赤・青・緑 × 1〜8 の24枚
  // 表の絵は data-front に持たせ、配るときは裏面（back.webp）で出してから、めくってオモテにする
  const card = (n, m) => `<div class="card" aria-label="${n}" data-front="art/${m}-${n}.webp"><img class="art" src="art/${m}-${n}.webp" alt="" draggable="false"></div>`;
  document.getElementById('board').innerHTML = card(7, 'red') + card(2, 'blue');
  document.body.insertAdjacentHTML('beforeend', '<div class="chips" id="chipsL"></div><div class="chips" id="oppChipsR"></div>');
  document.getElementById('mine').innerHTML =
    `<div class="hand">${card(8, 'green') + card(7, 'blue') + card(2, 'green')}</div>`;

  // 配る：24枚を混ぜて上から 場2枚・自分3枚・相手3枚（相手の表は data-front に持つだけで、勝負まで見せない）
  function dealCards() {
    const deck = ['red', 'blue', 'green'].flatMap(m => [1, 2, 3, 4, 5, 6, 7, 8].map(n => [n, m]));
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    const put = (c, [n, m], show) => {
      c.dataset.front = `art/${m}-${n}.webp`;
      if (show) { c.setAttribute('aria-label', n); const img = c.querySelector('img.art'); if (img) img.src = matchMedia('(prefers-reduced-motion: reduce)').matches ? c.dataset.front : 'back.webp'; }
    };
    const board = [...document.querySelectorAll('#board .card')];
    board.forEach((c, i) => { put(c, deck[i], true); c.querySelector('img.art').src = c.dataset.front; });   // 真ん中の2枚は表のまま出す
    HAND_ORDER.forEach((c, i) => put(c, deck[2 + i], true));
    OPP_ORDER.forEach((c, i) => put(c, deck[5 + i], false));
  }
  // ブルーチップ：ななめ上から見た円盤（上の面＋厚み、白いふちの模様6つ、内側の円と白い点線の輪）
  const INK = '#141414', WHITE = '#fbf7ec';
  const CHIP_SPIN = 15;   // 積んだチップの白い模様の向きをそろえる（全部同じ向き）
  const BLUE = { face: '#6b9be0', inner: '#86b0ea', side: '#4569a8' };
  function chipSVG(c, spin) {
    const T = 9, stripes = [], side = [];
    for (let i = 0; i < 6; i++) {
      const a = spin + i * 60;
      stripes.push(`<rect x="45" y="5" width="10" height="13" rx="2" fill="${WHITE}" stroke="${INK}" stroke-width="2" transform="rotate(${a} 50 50)"/>`);
      const r = ((a % 360) + 360) % 360, sx = Math.sin(r * Math.PI / 180), cy = Math.cos(r * Math.PI / 180);
      if (cy < -0.15) {
        const x = 50 + sx * 46, w = 9 * Math.sqrt(1 - sx * sx) + 2, yy = 40 + 33 * Math.sqrt(Math.max(0, 1 - sx * sx));
        side.push(`<rect x="${x - w / 2}" y="${yy}" width="${w}" height="${T - 1}" fill="${WHITE}"/>`);
      }
    }
    return `<svg viewBox="0 -4 100 90" aria-hidden="true">
      <path d="M4 40 L4 ${40 + T} A46 33 0 0 0 96 ${40 + T} L96 40 Z" fill="${c.side}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
      ${side.join('')}
      <path d="M4 ${40 + T} A46 33 0 0 0 96 ${40 + T}" fill="none" stroke="${INK}" stroke-width="4"/>
      <g transform="translate(0,4) scale(1,.72)">
        <circle cx="50" cy="50" r="46" fill="${c.face}" stroke="${INK}" stroke-width="4.5"/>
        ${stripes.join('')}
        <circle cx="50" cy="50" r="29" fill="${c.inner}" stroke="${INK}" stroke-width="3"/>
        <circle cx="50" cy="50" r="23" fill="none" stroke="${WHITE}" stroke-width="2.5" stroke-dasharray="6 5" transform="rotate(${spin} 50 50)"/>
      </g></svg>`;
  }
  // 山：下から8枚。1枚ごとに少しずつ上へ、向きもばらばら
  /* チップを山に置く：1列は20枚まで。21枚目からは隣に新しい列（本物の卓と同じ）。
     新しい列は手札から離れる向きに並ぶ（自分の青い山は左へ、自分の賭ける山は右へ、相手はその折り返し） */
  const COL = 20;
  function stackPos(el, i, st) {
    const dir = { chipsL: -1, redChips: 1, oppChipsR: 1, oppRedChips: -1 }[st.id] || 1;
    const per = /RedChips|redChips/.test(st.id) ? 10 : Infinity;   // 青い山はいつも1列（1回の勝負で1人が出すのは最大17枚）   // 賭ける山は10枚ごとに次の列（自分は左から右へ、相手は右から左へ）
    const col = Math.floor(i / per), row = i % per;
    const base = +(st.dataset.base || 0);   // 賭けのチップ（黒）の上に積むときは、その厚みぶん上から
    el.style.bottom = `calc(${row} * var(--chip) * .13 + ${base}px)`;
    el.style.left = `calc(${col * dir} * var(--chip) * 1.08)`;
  }
  const N = 5;   // 青いチップ＝参加料（アンティ）。お互い毎回5枚ずつ出す
  /* 持ち数：手元にあって、まだ卓に出していないチップの数。はじめはお互い30枚。
     配るときに参加料の5枚、赤いチップを出すたびにその枚数だけ減り、戻ってきた分・勝ってもらった分だけ増える。
     「モウイチド クバル」をまたいで続く（どちらかが参加料を払えなくなったら、お互い30枚からやり直し）。
     賭けられるのは持ち数まで（本物のポーカーと同じ） */
  const START = 40;   // 持ち数のはじめ（仮）
  const hold = { me: START, opp: START };
  let holdAtDeal = { ...hold }, settled = true;
  const countEls = { me: null, opp: null };
  function updateCount() { updateGauge(); }   // 持ち数はゲージで見せる（カードは賭けた枚数）
  /* 持ち数の綱引きゲージ（画面の左はし、手すりの内側にたてに1本）：
     上＝相手の持ち数（赤）、下＝自分の持ち数（黄緑）、真ん中＝いま卓に出ているチップ（灰色）。合計はいつも 40×2＝80枚。
     勝つと自分の色が伸び、負けると押し返される。持ち数が1回で動く最大（17枚）より少ないと、数字が赤く点滅する */
  const gauge = document.createElement('div'); gauge.className = 'gauge'; gauge.setAttribute('aria-label', '持ち数');
  gauge.innerHTML = '<span class="g-n g-opp"></span><div class="g-bar"><i class="g-o"></i><i class="g-t"></i><i class="g-m"></i></div><span class="g-n g-me"></span>';
  document.body.appendChild(gauge);
  function updateGauge() {
    const T = START * 2, t = Math.max(0, T - hold.me - hold.opp);
    gauge.querySelector('.g-o').style.flexGrow = hold.opp; gauge.querySelector('.g-t').style.flexGrow = t; gauge.querySelector('.g-m').style.flexGrow = hold.me;
    const o = gauge.querySelector('.g-opp'), m = gauge.querySelector('.g-me');
    o.textContent = hold.opp; m.textContent = hold.me;
    o.classList.toggle('low', hold.opp < 17); m.classList.toggle('low', hold.me < 17);
    gauge.setAttribute('aria-label', `持ち数 アナタ ${hold.me}・アイテ ${hold.opp}・卓の上 ${t}`);
  }
  let tagFrozen = false;   // 勝負・フォールドが始まったら、賭けた枚数のカードの数字を止める（精算でチップが動いても変えない）
  // 青い山に乗っている枚数（飛んでいる途中のチップは数えない）
  function pileCount(k) {
    const st = document.getElementById(k === 'me' ? 'chipsL' : 'oppChipsR');
    if (!st) return 0;
    return [...st.querySelectorAll('.chip')].filter(c => !c.getAnimations().some(a => a.playState === 'running' || a.playState === 'pending')).length;
  }
  // 賭けた枚数のカードの数字を、着地に合わせて書きかえる（勝負が終わって山が動き出したら止める）
  function updatePileTags() {
    for (const k of ['me', 'opp']) {
      const el = countEls[k]; if (!el) continue;
      const st = document.getElementById(k === 'me' ? 'chipsL' : 'oppChipsR');
      if (st.getAnimations().length || tagFrozen) continue;
      el.querySelector('.cc-n').textContent = pileCount(k);
    }
  }
  setInterval(updatePileTags, 120);
  function spend(who, k) { hold[who] -= k; updateCount(); }
  function buildBlue() {
   document.querySelectorAll('#chipsL, #oppChipsR').forEach(chips => {
    chips.innerHTML = '';
    for (let i = 0; i < N; i++) {
      const el = document.createElement('div'); el.className = 'chip';
      stackPos(el, i, chips);   // 1枚の厚み＝チップの幅の 0.13（投げる実験と同じ）
      el.innerHTML = chipSVG(BLUE, CHIP_SPIN);
      chips.appendChild(el);
    }
   });
  }
  buildBlue();

  // チップの山の置き場所：高さは場の2枚の真ん中と手札の真ん中のちょうど間、横は手札の左右の外に 18px あけて。
  // 自分の山は手札の左（chipsL）、相手の山は相手の手札の右（oppChipsR）に1つずつ
  function placeChips() {
    const b = document.getElementById('board').getBoundingClientRect();
    const mine = document.querySelector('.hand').getBoundingClientRect();
    const opp = document.querySelector('.row.opp').getBoundingClientRect();
    const midOf = (a, c) => ((a.top + a.bottom) / 2 + (c.top + c.bottom) / 2) / 2;
    // 横は左右対称：自分の山を手札の左の外に置き、相手の山はそれを画面の真ん中で折り返した位置（右側）に置く
    const me = document.getElementById('chipsL'), op = document.getElementById('oppChipsR');
    const w = me.getBoundingClientRect().width;
    const x = Math.min(Math.max(mine.left - 18 - w, 36), innerWidth / 2 - w);   // 左の手すり（32px）にかからないように
    me.style.left = x + 'px';
    op.style.left = (innerWidth - x - w) + 'px';
    me.style.top = (midOf(b, mine) - me.getBoundingClientRect().height / 2) + 'px';
    // 高さも上下対称：相手の山は、自分の山を場の2枚の真ん中（高さ）で折り返した位置
    const bMid = (b.top + b.bottom) / 2, meMid = midOf(b, mine);
    op.style.top = (2 * bMid - meMid - op.getBoundingClientRect().height / 2) + 'px';
  }
  addEventListener('resize', placeChips);
  placeChips();

  /* 配る演出（ページを開いたときに1回）：
     1. ブルーチップが投げ込まれる：自分の山は画面の下から、相手の山は画面の上から、1枚ずつ弧を描いて積まれる
     2. 手札がくる：自分の3枚は画面の右から、相手の3枚は画面の左から、1枚ずつ（前の1枚が置かれてから）交互にすべってくる
     3. 真ん中の2枚がくる：左の1枚は画面の左から、右の1枚は画面の右から */
  function dealIn() {
    tagFrozen = false;
    dealCards();   // 毎回24枚をよく混ぜて、場の2枚・自分の3枚・相手の3枚を配る
    holdAtDeal = { ...hold }; settled = false;
    hold.me -= N; hold.opp -= N;   // 参加料
    updateGauge();
    showRound();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { startPick(); return; }

  //   続けて押したときは順番待ちにして、前の1枚が持ち上がってから次の1枚が動く（まとめて飛ばない）。
  //   動き：山の上からまっすぐ持ち上がる → 小さな弧で外側へ → 回らずに画面の下へすっと下りる（フヤスで来たときの逆）
  let backQueue = 0, backBusy = false;
  function takeBack() {
    const left = redSt.children.length - backQueue;   // 戻す予約を引いた、残る枚数

  async function backLoop() {
    backBusy = true;

      document.body.appendChild(c);

        { transform: 'none' },
        { transform: 'translate(0, -28px) scale(1.06)', offset: .22 },
        { transform: `translate(24px, -36px) scale(1.06)`, offset: .4 },
        { transform: `translate(40px, ${dy}px) scale(1)` },

    }

  /* 精算（ポーカーと同じ数え方）：
     お互いの山＝参加料の青5枚＋賭けた赤。勝った方が、負けた方の山をもらう。
     ただし負けた方の赤のうち、勝った方の赤より多い分は「誰も受けていない賭け」なので、持ち主に戻る。
     もらうチップは、負けた方の山の上から1枚ずつ、勝った方の山の上へ飛んで積まれる

  async function payout(winner) {

    if (extra > 0) {

      back.forEach((c, i) => {
        if (reduceMotion) { c.remove(); return; }
        const r = c.getBoundingClientRect(), dy = (toBottom ? innerHeight + 80 : -120) - r.top;
        c.animate([{ transform: 'none' }, { transform: `translate(0, ${toBottom ? -30 : 30}px) scale(1.1)`, offset: .25 }, { transform: `translate(${(Math.random() - .5) * 140}px, ${dy}px) rotate(${(Math.random() - .5) * 160}deg)` }],
          { duration: 520, delay: i * 70, easing: 'cubic-bezier(.5,0,.75,.4)', fill: 'forwards' }).finished.then(() => c.remove(), () => {});
      });

    }
    // 2. 残り（青5枚＋受けてもらえた赤）を、いちばん上のチップから1枚ずつ勝った方の山へ：
    //    山の上からまっすぐ持ち上がる → 高い弧で飛ぶ → 勝った方の山の真上から落ちて、いちばん上に積まれる
    //    飛んでいるチップはほかのものより手前に出す（相手の山の下をくぐらないように）
    // 飛んでいるチップは「もらう側の山」の中にあるので、もらう側の山を出す側の山より手前にする
    // （同じ高さだと、ページの後ろにある相手の山の方が手前に描かれ、自分の方へ来るチップが相手の山の下から出てくるように見えていた）
    from.style.zIndex = 4; to.style.zIndex = 5;
    const top = el => [...el.querySelectorAll('.chip')].filter(c => !c.getAnimations().length).pop();
    let moved = 0;
    const total = [...from.querySelectorAll('.chip')].length, g = Math.min(190, 2400 / Math.max(total, 1));   // たくさんのときは間を詰める
    for (let c = top(from); c; c = top(from)) {
      const chip = c; moved++;
      const before = c.getBoundingClientRect();
      stackPos(c, to.querySelectorAll('.chip').length, to);
      c.style.zIndex = 5;
      to.appendChild(c);
      const after = c.getBoundingClientRect(), dx = before.left - after.left, dy = before.top - after.top;
      const lift = 34, peak = Math.min(dy, 0) - 70;
      if (!reduceMotion) c.animate([
        { transform: `translate(${dx}px, ${dy}px)` },
        { transform: `translate(${dx}px, ${dy - lift}px) scale(1.08)`, offset: .18 },
        { transform: `translate(${dx / 2}px, ${peak}px) rotate(${(Math.random() - .5) * 40}deg) scale(1.18)`, offset: .5 },
        { transform: `translate(0, -${lift}px) scale(1.08)`, offset: .78 },
        { transform: 'none', offset: .9 }, { transform: 'translate(0, -4px)', offset: .95 }, { transform: 'none' },
      ], { duration: 640, easing: 'ease-in-out' }).finished.then(() => chip.style.zIndex = '', () => {});
      else c.style.zIndex = '';
      if (moved % Math.ceil(190 / g) === 0) playAt('chipClack', 580, .5);
      flipTimers.push(setTimeout(() => spend(win, -1), 580));   // 着地したら、勝った方の持ち数が1つ増える
      await wait(g);
    }
    await wait(700);
    from.style.zIndex = to.style.zIndex = '';
    spend(win, -([...to.querySelectorAll('.chip')].length - moved));   // 勝った方が自分で出していた分も戻る
    settled = true;
  }
  // フォールド：自分の伏せた2枚が青い火で焼けて消える（PROBE POKER のフォールドと同じ青い火）
  // フォールド：降りた側（自分＝画面の下）から青い火が上っていく。自分の2枚が下から焼けはじめ、少し遅れて相手の2枚も下から焼ける
  async function fold(loser = 'me') {
    tagFrozen = true;
    fadeShownTabs();   // 全部表にするので、ミセタの札はもういらない（ゆっくり消える）
    leaveTab();   // 勝負がつく前に「ハンド」のタブは右へすべって消える
    const vis = row => [...row.querySelectorAll('.card')].filter(c => c.style.visibility !== 'hidden');
    const mine = vis(handEl), theirs = vis(document.querySelector('.row.opp'));
    // お互い表に返す（自分は左から、相手は右から）。相手は配られた本当のカード
    for (let i = 0; i < 2; i++) {
      if (mine[i]) { flipImg(mine[i], true); await wait(260); }
      if (theirs[theirs.length - 1 - i]) { flipImg(theirs[theirs.length - 1 - i], true); await wait(260); }
    }
    await wait(300);
    // 降りた側の2枚は灰色になって少し沈む（自分は下へ、相手は上へ：点対称）。焼けて次の回に配り直すときに元へ戻す
    const lost = loser === 'me' ? mine : theirs, dir = loser === 'me' ? 1 : -1;
    lost.forEach(c => foldFx.push(c.animate([{ filter: 'grayscale(0) brightness(1)', translate: '0 0' }, { filter: 'grayscale(1) brightness(.72)', translate: `0 ${dir * 12}px` }],
      { duration: 450, easing: 'ease-out', fill: 'forwards' })));
    // その2枚の真ん中に「オリタ」の札がポン（対決の役の札と同じ形・番号の丸なし・灰色）
    if (lost.length) {
      const rs = lost.map(c => c.getBoundingClientRect()), cw = rs[0].width;
      const x = (Math.min(...rs.map(r => r.left)) + Math.max(...rs.map(r => r.right))) / 2, y = (Math.min(...rs.map(r => r.top)) + Math.max(...rs.map(r => r.bottom))) / 2 + dir * 12;
      const w = cw * 1.6, h = cw * .62, el = document.createElement('div'); el.className = 'cb-pop cb-num cb-fold';
      Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); el.style.setProperty('--fs', (cw * .2) + 'px');
      el.innerHTML = plateSVG(w, h, '#9a958c', '') + '<span>オリタ</span>';
      document.body.appendChild(el); made.push(el);
      el.animate([{ transform: 'scale(0) rotate(-20deg)' }, { transform: 'scale(1.35) rotate(8deg)', offset: .6 }, { transform: 'scale(.92) rotate(-3deg)', offset: .82 }, { transform: 'scale(1) rotate(0deg)' }],
        { duration: 480, easing: 'ease-out', fill: 'both' });
      playSfx('cardThrow', .6);
    }
    await wait(1300);   // 表に返したまま（焼かない）
    record(mine, loser === 'me' ? 'fold' : 'oppFold', false);
    await payout(other(loser));   // 降りた側の山（参加料＋それまでに賭けた分）を、もう一方がもらう
    endHand();
  }

  /* ---- 対決 ---- */
  // 役の判定：4枚（自分の2枚＋場の2枚）。強い順に 役1 ストレートフラッシュ … 役9 ハイカード。比べるための [強さ, 数字…] を返す
  const ROLE = ['', 'ストレートフラッシュ', 'スリーカード', 'フラッシュ', 'ツーペア', 'ストレート', 'マークツキペア', 'ミニストレート', 'ワンペア', 'ハイカード'];
  const parse = src => { const m = src.match(/(red|blue|green)-(\d)/); return { suit: m[1], n: +m[2] }; };
  function evalHand(cards) {
    const ns = cards.map(c => c.n).sort((a, b) => b - a), cnt = {};
    ns.forEach(n => cnt[n] = (cnt[n] || 0) + 1);
    const groups = Object.entries(cnt).map(([n, k]) => [+n, k]).sort((a, b) => b[1] - a[1] || b[0] - a[0]);
    const flush = new Set(cards.map(c => c.suit)).size === 1;
    const uniq = [...new Set(ns)].sort((a, b) => a - b);
    const straight = uniq.length === 4 && uniq[3] - uniq[0] === 3;
    const byGroup = groups.flatMap(([n, k]) => Array(k).fill(n));
    let role;
    if (straight && flush) role = 1;
    else if (groups[0][1] === 3) role = 2;
    else if (flush) role = 3;
    else if (groups[0][1] === 2 && groups[1][1] === 2) role = 4;
    else if (straight) role = 5;
    else if (groups[0][1] === 2) {
      const others = cards.filter(c => c.n !== groups[0][0]);
      role = others[0].suit === others[1].suit ? 6 : 8;
    } else role = [0, 1].some(i => uniq[i + 2] - uniq[i] === 2) ? 7 : 9;
    return { role, key: [10 - role, ...byGroup] };
  }
  const cmp = (a, b) => { for (let i = 0; i < a.key.length; i++) if (a.key[i] !== b.key[i]) return a.key[i] - b.key[i]; return 0; };
  // 勝ち負け（「2と5」ルール）：役の番号の差がちょうど2か5なら、弱い役（番号が大きい方）が勝つ（ゲコクジョウ）。それ以外は cmp で強い方
  //   正なら a の勝ち、負なら b の勝ち、0 は引き分け
  const UPSET = [2, 5];
  // 画面に出す役の番号は、強いほど大きい（ストレートフラッシュ＝9 … ハイカード＝1）。中の計算は今までどおり 1＝いちばん強い
  function SHOWN_NO(r) { return 10 - r; }
  const judge = (a, b) => { const d = a.role - b.role; if (UPSET.includes(Math.abs(d))) return d; return cmp(a, b); };
  // 絵だけを裏返す（前に出た位置はそのまま）
  function flipImg(c, toFront) {
    const img = c.querySelector('img.art') || c.appendChild(Object.assign(document.createElement('img'), { className: 'art', alt: '' }));
    if (toFront && img.src.includes(c.dataset.front)) return;
    const next = toFront ? c.dataset.front : 'back.webp';
    flipCard(c, () => { img.src = next; c.classList.toggle('peeking', toFront && handEl.classList.contains('peek')); }, next);
  }
  // カードごと裏返す：1本の動きで、縦の軸でくるっと回る（持ち上がる → 真横で絵が替わる → 反対側から回って置かれる）。
  // 次の絵は先に読み込んで（decode）から回すので、替わる瞬間に白くなったり遅れたりしない。
  // composite: 'add' で、前に出た位置などほかの動きに「足す」ので、カードの位置はそのまま
  const FLIP_MS = 460, HALF = .46;
  const decoded = new Map();
  const keepImgs = [];   // 読み込んだ絵を手放さない（手放すと、用意した絵が捨てられて、はじめて出すときに引っかかることがある）
  function preload(src) {
    if (!decoded.has(src)) { const im = new Image(); im.src = src; keepImgs.push(im); decoded.set(src, im.decode().catch(() => {})); }
    return decoded.get(src);
  }
  async function flipCard(c, swap, nextSrc) {
    if (nextSrc) await Promise.race([preload(nextSrc), new Promise(r => setTimeout(r, 300))]);
    const T = 'perspective(700px)';
    // 相手のカードは自分と点対称：回る向きも、持ち上がる向き（場の方＝画面の下）も逆にする
    const m = c.closest('.row.opp') ? -1 : 1;
    c.animate([
      { transform: `${T} rotateY(0deg) translateY(0) scale(1)`, easing: 'cubic-bezier(.4,0,.9,.6)' },
      { transform: `${T} rotateY(${90 * m}deg) translateY(${-10 * m}px) scale(1.07)`, offset: HALF },
      { transform: `${T} rotateY(${-90 * m}deg) translateY(${-10 * m}px) scale(1.07)`, offset: HALF + .001, easing: 'cubic-bezier(.1,.5,.4,1)' },

  }
  // 表の絵と裏面は、最初に読み込んでおく
  // 相手のカードの表は勝負のときに決まるので、24枚ぜんぶ先に読み込む（読み込み待ちで返すのが遅れたり、白くなったりしないように）
  // （ロゴ動画の入りを邪魔しないように、読み込むのはロゴ動画が終わってから。playIntro の finish で呼ぶ）
  const preloadCards = () => ['back.webp', ...['red', 'blue', 'green'].flatMap(c => [1, 2, 3, 4, 5, 6, 7, 8].map(n => `art/${c}-${n}.webp`))].forEach(preload);
  // 役の名前の札：角の丸い板（黒ふち）＋上半分の光の帯＋左はしに役の番号の黒い丸
  const plateSVG = (w, h, fill, n) => {
    const r = h * .34, sw = Math.max(3, h * .07), cr = h * .3, cx = h * .48;

      <rect x="${sw / 2}" y="${sw / 2}" width="${w - sw}" height="${h - sw}" rx="${r}" fill="${fill}" stroke="#141414" stroke-width="${sw}"/>

      ${n === '' ? '' : `<circle cx="${cx}" cy="${h / 2}" r="${cr}" fill="#141414"/>
      <text x="${cx}" y="${h / 2}" dy=".36em" text-anchor="middle" font-family="Luckiest Guy, sans-serif" font-size="${cr * 1.35}" fill="#fff">${n}</text>`}
    </svg>`;
  };
  const burstSVG = (fill, n = 14, inner = .74, jag = .08) => {

  };
  const made = [];
  const msg = Object.assign(document.createElement('p'), { className: 'result-msg' }); document.body.appendChild(msg);
  const foldFx = [];   // 降りた側のカードを灰色にした動き（次の回の前に消す）
  // 「ミセタ」の札：パッと消さず、ゆっくりフェードアウトしてから取りのぞく
  function fadeShownTabs() {
    document.querySelectorAll('.shown-tab').forEach(t => {
      if (t._fading) return; t._fading = true;
      if (reduceMotion) { t.remove(); return; }
      t.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 800, easing: 'ease-in-out', fill: 'forwards' }).finished.then(() => t.remove(), () => t.remove());
    });
  }
  /* 試合の記録（結果の表に出す）：回ごとに、自分が選んだ2枚・役・賭けた枚数（参加料＋賭け）・結果・ゲコクジョウで勝ったか */
  const matchLog = [];
  function record(two, result, upset) {
    const cards = two.map(c => parse(c.dataset.front));
    const ev = evalHand([...cards, ...[...document.querySelectorAll('#board .card')].map(c => parse(c.dataset.front))]);
    matchLog.push({ round, cards, role: ev.role, bet: holdAtDeal.me - hold.me, result, upset: upset && result === 'win' });
  }
  function clearShowdown() { foldFx.splice(0).forEach(a => a.cancel()); made.splice(0).forEach(e => e.remove()); msg.getAnimations().forEach(a => a.cancel()); document.querySelectorAll('.row.opp .card img.art').forEach(i => i.remove()); }
  async function showdown() {
    tagFrozen = true;
    fadeShownTabs();
    leaveTab();   // 対決の前に「ハンド」のタブは右へすべって消える
    const vis = row => [...row.querySelectorAll('.card')].filter(c => c.style.visibility !== 'hidden');
    const mine = vis(handEl), oppRow = document.querySelector('.row.opp'), theirs = vis(oppRow);
    const board = [...document.querySelectorAll('#board .card')];
    // 本当の勝負：お互いの2枚＋場の2枚で比べる（同じ強さなら引き分け）
    const boardC = board.map(c => parse(c.dataset.front));
    const meEval = evalHand([...mine.map(c => parse(c.dataset.front)), ...boardC]);
    const oppEval = evalHand([...theirs.map(c => parse(c.dataset.front)), ...boardC]);
    const res = judge(meEval, oppEval), winner = res > 0 ? 'me' : res < 0 ? 'opp' : 'tie';
    // 1. お互いの2枚をオモテに返す
    for (let i = 0; i < 2; i++) {   // お互い表に返す：自分は左から、相手は右から
      flipImg(mine[i], true); await wait(260);
      flipImg(theirs[theirs.length - 1 - i], true); await wait(260);
    }
    await wait(500);
    // 2. 真ん中に「VS」がドン
    const b = document.getElementById('board').getBoundingClientRect(), fx = b.left + b.width / 2, fy = b.top + b.height / 2;
    const cw = mine[0].getBoundingClientRect().width;
    const pop = (cls, x, y, w, h, fill, text, fs) => {
      const el = document.createElement('div'); el.className = 'cb-pop ' + cls;
      Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); el.style.setProperty('--fs', fs + 'px');
      el.innerHTML = (cls === 'cb-num' ? plateSVG(w, h, fill, num) : burstSVG(fill)) + `<span>${text}</span>`;
      document.body.appendChild(el); made.push(el); return el;
    };
    let num = 0;   // 役の名前の札に入れる役の番号
    const vs = pop('cb-vs', fx, fy, cw * 1.25, cw * 1.07, '#FFD84A', 'VS', cw * .5);
    playSfx('cardThrow', .8);
    await vs.animate([{ transform: 'scale(3) rotate(-25deg)', opacity: 0 }, { transform: 'scale(.85) rotate(4deg)', opacity: 1, offset: .55 }, { transform: 'scale(1.08) rotate(-3deg)', offset: .8 }, { transform: 'scale(1) rotate(0deg)', opacity: 1 }],
      { duration: 420, easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards' }).finished;
    // 3. 両方のカードの上に、役の名前の札がポン（自分＝黄緑、相手＝赤）。
    //    札はボタンと同じ、太い黒ふちの角の丸い板。左に役の番号の黒い丸、上半分にうすい光の帯
    const center = els => { const rs = els.map(e => e.getBoundingClientRect()); return { x: (Math.min(...rs.map(r => r.left)) + Math.max(...rs.map(r => r.right))) / 2, y: (Math.min(...rs.map(r => r.top)) + Math.max(...rs.map(r => r.bottom))) / 2 }; };
    const items = [{ side: 'me', role: meEval.role, at: center(mine), fill: '#B6F23A' }, { side: 'opp', role: oppEval.role, at: center(theirs), fill: '#ff8a7a' }];
    const badges = items.map((o, i) => {
      num = SHOWN_NO(o.role);

      const ps = two.map(c => parse(frontOf(c))), e = evalHand([...ps, ...boardC]);
      if (!best[e.role] || cmp(e, best[e.role][2]) > 0) best[e.role] = [ps, true, e];
    }
    const used = new Set([...handEl.querySelectorAll('.card'), ...document.querySelectorAll('#board .card')].map(frontOf));
    const pool = []; for (const suit of ['red', 'blue', 'green']) for (let n = 1; n <= 8; n++) { const f = `art/${suit}-${n}.webp`; if (!used.has(f)) pool.push(parse(f)); }
    for (let i = 0; i < pool.length; i++) for (let j = i + 1; j < pool.length; j++) {
      const e = evalHand([pool[i], pool[j], ...boardC]);
      if (!best[e.role]) best[e.role] = [[pool[i], pool[j]], false, e];
    }

    const SUITS = ['red', 'blue', 'green'], all = SUITS.flatMap(suit => [1, 2, 3, 4, 5, 6, 7, 8].map(n => ({ suit, n })));
    const free = {};
    for (const s0 of SUITS) for (const s1 of SUITS) {
      const bd = [{ suit: s0, n: boardC[0].n }, { suit: s1, n: boardC[1].n }];
      const same = (a, b) => a.suit === b.suit && a.n === b.n;
      if (same(bd[0], bd[1])) continue;

        const two = [all[i], all[j]];
        if (two.some(t => bd.some(b => same(t, b)))) continue;

  function dealerSpot(who) {

  /* 1回目の先手決め（PROBE POKER Ver1.2 の「黄色いチップの投げ合い」と同じ流れ）：

      const arc = 70 + Math.random() * 50, spin0 = Math.random() * 360, spinTotal = 360 + Math.random() * 360, tilt0 = (Math.random() - .5) * 40;
      const dur = 420 + Math.hypot(tx - sx, ty - sy) * .45 + Math.random() * 120, t0 = performance.now();

        <p>コンピューターと7回勝負。はじめの持ち数はお互い40枚。7回が終わったとき、持ち数が多い方の勝ち。</p>
        <h3>1回の流れ</h3>
        <p>① 参加料として5枚を出す。カード（数字1〜8 × 赤・青・緑の24枚）が配られる。真ん中の2枚は表のまま、お互い同じものを使う。</p>
        <p>② 手札3枚から2枚を選んで「ケッテイ」。残りの1枚は焼ける。選んだ2枚＋真ん中の2枚の4枚で役を作る。</p>
        <p>③ 1回目の賭け → お互い、出した2枚のうち1枚を見せる → 2回目の賭け。</p>
        <p>④ 対決。役で勝った方が、卓の上のチップを全部もらう。役も数字もまったく同じなら引き分け（お互い自分の分を引き取る）。</p>
        <h3>試合の終わり</h3>
        <p>7回が終わるか、どちらかの持ち数が5枚より少なくなったら終わり。最後に持ち数を比べて勝ち負けが決まる。</p></div>
        <div class="t-page" data-p="3" hidden><h3>ツカウ カード（24マイ）</h3>
          <p>数字 1〜8 × 背景の色 3つ（赤・青・緑）で、全部で24枚。同じカードは1枚ずつしかない。背景の色が、トランプのマーク（スート）の代わり。</p>
          <div class="t-deck">${['red', 'blue', 'green'].map(c => `<div class="t-deck-row"><span class="t-deck-c ${c[0]}">${{ red: '赤', blue: '青', green: '緑' }[c]}</span>${[1, 2, 3, 4, 5, 6, 7, 8].map(n => `<img src="art/${c}-${n}.webp" alt="${{ red: '赤', blue: '青', green: '緑' }[c]}の${n}" loading="lazy">`).join('')}</div>`).join('')}</div>
          <p>毎回24枚をよく混ぜて、真ん中に2枚、お互いに3枚ずつ配る（使うのは8枚。残りの16枚は使わない）。</p>
        </div>
        <div class="t-page" data-p="1" hidden><h3>ハンド（強い順）</h3>
        <ol>${HANDS.map(([nm, ds, ex], i) => { const up = upsetOf(i + 1);
          return `<li><span class="no">${SHOWN_NO(i + 1)}</span><span class="nm">${nm}${up.length ? `<em class="gk">${up.map(SHOWN_NO).sort((a, b) => b - a).join('・')}ニ カツ</em>` : ''}</span><span class="ds">${ds}</span><span class="ex">${ex.split(' ').map(t => `<b class="${t[0]}">${t.slice(1)}</b>`).join('')}</span></li>`; }).join('')}</ol>
        <h3>ゲコクジョウ（2と5のルール）</h3>
        <p>役の番号の差がちょうど <b>2</b> か <b>5</b> のときは、弱い方（番号が小さい方）が勝つ。それ以外は強い方が勝つ。同じ役なら、数字の大きさで比べる。</p></div>
        <div class="t-page" data-p="2" hidden><h3>賭け</h3>
        <p>先手から順に動く。先手は1回ごとに交代（1回目はチップの投げ合いで決める）。</p>
        <p>1回目：ヨウスミ／1マイ／2マイ。2回目：ヨウスミ／1マイ／4マイ。</p>
        <p>賭けられたら「同じ枚数でカケル」か「倍にしてカケル（上乗せ）」。上乗せは1回の賭けにつき1度だけ。2回目の賭けでは「オリル」もできる。オリたら、それまでに出したチップは相手のもの。</p></div>`;
      // タブで切り替える（スクロールしなくても1ページに収まるように分ける）
      pn.querySelector('.t-tabs').addEventListener('click', e => {
        const b = e.target.closest('[data-p]'); if (!b) return; playSfx('chipClack', .3);
        pn.querySelectorAll('.t-tabs button').forEach(t => t.setAttribute('aria-selected', String(t === b)));
        pn.querySelectorAll('.t-page').forEach(pg => pg.hidden = pg.dataset.p !== b.dataset.p);
      });
    } else {
      pn.setAttribute('aria-label', 'セッテイ');
      pn.innerHTML = `<div class="t-head"><h2>セッテイ</h2><button type="button" class="t-x t-close">トジル</button></div>${SOUND_ROW}
        <h3>セイセキ（ツウサン）</h3><div class="t-statbox"></div>
        <p class="t-ver">YON POKER ver 1.0</p>`;
      wireSound(pn);
      // セイセキ：カチ・マケ・ヒキワケと勝率。リセットは「ハイ／イイエ」で確かめてから
      const box = pn.querySelector('.t-statbox');
      const showStat = () => {
        const st = loadStats(), n = st.w + st.l + st.d;
        box.innerHTML = `<div class="t-stat"><span>カチ<b>${st.w}</b></span><span>マケ<b>${st.l}</b></span><span>ヒキワケ<b>${st.d}</b></span><span>カチリツ<b>${n ? Math.round(st.w / n * 100) : 0}%</b></span></div>
          <div class="t-sub"><span>${n} シアイ</span><button type="button" class="t-x" data-s="ask">リセット</button></div>`;
      };
      box.addEventListener('click', e => {
        const b = e.target.closest('[data-s]'); if (!b) return; playSfx('chipClack', .4);
        if (b.dataset.s === 'ask') box.querySelector('.t-sub').innerHTML = '<span>ホントニ ケス？</span><span class="t-tog"><button type="button" class="t-x" data-s="yes">ハイ</button><button type="button" class="t-x" data-s="no">イイエ</button></span>';
        else { if (b.dataset.s === 'yes') try { localStorage.removeItem(STAT_KEY); } catch (err) {} showStat(); }
      });
      showStat();
    }
    pn.querySelector('.t-close').addEventListener('click', () => { playSfx('chipClack', .4); closeTitlePanel(); });
    document.body.appendChild(pn); titlePanel = pn;
    if (!reduceMotion) pn.animate([{ transform: `translateX(${innerWidth}px)` }, { transform: 'translateX(-10px)', offset: .8 }, { transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.2,.8,.3,1)' });
  }
  // オトの ON／OFF の行（タイトルのセッテイと、試合中のセッテイで同じもの）
  // オトの行：BGM と SE（効果音）を別々に、ON／OFF とオオキサ（タイトルのセッテイと、試合中のセッテイで同じもの）
  const soundRows = (k, label) => `<h3>${label}</h3>`
    + `<div class="t-row"><span>ON／OFF</span><span class="t-tog"><button type="button" data-${k}m="0">ON</button><button type="button" data-${k}m="1">OFF</button></span></div>`
    + `<div class="t-row"><span>オオキサ</span><span class="t-tog"><button type="button" data-${k}v=".5">ショウ</button><button type="button" data-${k}v="1">チュウ</button><button type="button" data-${k}v="1.6">ダイ</button></span></div>`;
  const SOUND_ROW = soundRows('b', 'BGM') + soundRows('s', 'SE（コウカオン）');
  function wireSound(pn) {
    const sync = () => {
      pn.querySelectorAll('[data-sm]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.sm === '1') === muted)));
      pn.querySelectorAll('[data-sv]').forEach(b => { b.setAttribute('aria-pressed', String(+b.dataset.sv === vol)); b.disabled = muted; b.style.opacity = muted ? .45 : ''; });
      pn.querySelectorAll('[data-bm]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.bm === '1') === bgmMuted)));
      pn.querySelectorAll('[data-bv]').forEach(b => { b.setAttribute('aria-pressed', String(+b.dataset.bv === bgmVol)); b.disabled = bgmMuted; b.style.opacity = bgmMuted ? .45 : ''; });
    };
    sync();
    pn.querySelectorAll('.t-tog').forEach(t => t.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      const d = b.dataset;
      if (d.sm != null) muted = d.sm === '1';
      if (d.sv != null) vol = +d.sv;
      if (d.bm != null) bgmMuted = d.bm === '1';
      if (d.bv != null) bgmVol = +d.bv;
      try {
        localStorage.setItem('yonpoker-mute', muted ? '1' : '0'); localStorage.setItem('yonpoker-vol', String(vol));
        localStorage.setItem('yonpoker-bgm-mute', bgmMuted ? '1' : '0'); localStorage.setItem('yonpoker-bgm-vol', String(bgmVol));
      } catch (err) {}
      sync(); updateBgm(); playSfx('chipClack', .5);   // SE は今の大きさで1回鳴る。BGM はすぐ合わせる
    }));
  }
  // セイセキ（このブラウザでの通算）：結果の表が出るたびに1つ足す。コウサンはマケ
  const STAT_KEY = 'yonpoker-stats';
  function loadStats() { try { const o = JSON.parse(localStorage.getItem(STAT_KEY) || '{}'); return { w: o.w | 0, l: o.l | 0, d: o.d | 0 }; } catch (e) { return { w: 0, l: 0, d: 0 }; } }
  function addStat(kind) { const st = loadStats(); st[kind === 'win' ? 'w' : kind === 'lose' ? 'l' : 'd']++; try { localStorage.setItem(STAT_KEY, JSON.stringify(st)); } catch (e) {} }
  /* 試合中のセッテイ（「1 / 7」の下のボタン）：オト・コウサン・タイトルヘ モドル・モドル（板を閉じて試合に戻る）。
     コウサン・タイトルヘ モドルは「ハイ／イイエ」で確かめてから。コウサンは持ち数に関係なく負け（YOU LOSE の結果の表へ） */
  const gameSet = Object.assign(document.createElement('button'), { type: 'button', className: 'game-set', textContent: 'セッテイ' });
  gameSet.style.visibility = 'hidden';
  document.body.appendChild(gameSet);
  gameSet.addEventListener('click', () => { playSfx('chipClack', .4); if (titlePanel) closeTitlePanel(); else openGamePanel(); });
  function openGamePanel() {
    closeTitlePanel();
    const pn = document.createElement('section'); pn.className = 'hand-panel title-panel'; pn.setAttribute('aria-label', '試合中のセッテイ');
    const main = () => {
      pn.innerHTML = `<h2>セッテイ</h2>${SOUND_ROW}
        <div class="t-acts">
          <button type="button" class="rs-ok danger" data-a="give">コウサン</button>
          <button type="button" class="rs-ok dark" data-a="title">タイトルヘ モドル</button>
          <button type="button" class="rs-ok" data-a="close">モドル</button>
        </div>`;
      wireSound(pn);
    };
    const ask = a => {
      pn.innerHTML = `<h2>セッテイ</h2>
        <p class="t-ask">${a === 'give' ? 'ホントニ コウサン スル？<br><small>（モチスウ ニ カンケイナク マケ）</small>' : 'ホントニ タイトルヘ モドル？<br><small>（コノ シアイ ハ オワリ）</small>'}</p>
        <div class="t-acts two"><button type="button" class="rs-ok ${a === 'give' ? 'danger' : 'dark'}" data-a="yes-${a}">ハイ</button><button type="button" class="rs-ok" data-a="no">イイエ</button></div>`;
    };
    pn.addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      const a = b.dataset.a; playSfx('chipClack', .4);
      if (a === 'close') closeTitlePanel();
      else if (a === 'give' || a === 'title') ask(a);
      else if (a === 'no') main();
      else if (a === 'yes-give') stopMatch('give');
      else if (a === 'yes-title') stopMatch('title');
    });
    main();
    document.body.appendChild(pn); titlePanel = pn;
    if (!reduceMotion) pn.animate([{ transform: `translateX(${innerWidth}px)` }, { transform: 'translateX(-10px)', offset: .8 }, { transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.2,.8,.3,1)' });
  }
  // 試合を途中で止める：前の試合の流れ（待ち）を全部止めて、卓を片づける。コウサンは YOU LOSE の結果の表、タイトルヘ モドルはそのままタイトルへ
  function stopMatch(kind) {
    matchEpoch++;
    closeTitlePanel();
    resetTable();
    document.querySelectorAll('.toss-chip, .cb-pop, .shown-tab, .burn-cv').forEach(e => e.remove());
    hideTable();
    if (kind === 'give') showResult('lose', { surrender: true });
    else backToTitle();
  }
  // 結果の表の「カクニンシタ」：卓を片づけてタイトルへ
  function backToTitle() {
    matchLog.length = 0;
    resetTable();
    hold.me = hold.opp = START; round = 1; settled = true; first = null; dealerMoved = false;
    updateGauge(); showRound();
    showTitle();
  }
  // はじめはロゴ動画 → タイトルの場面（PvE を押すと、7回勝負の1回目の先手決めから）
  // 入りがきれいにそろうように、動画が最後まで読み込めて、フォントの準備もできてから再生する（最大1.5秒待つ）。
  // 動画が終わる（3.47秒）かタップしたら、その瞬間の画面がまん中から左右に割れて開き（スプリット）、下からタイトルが出てくる。
  // 再生できなかったときや、念のための7秒は、白をふわっと消すだけ
  (function playIntro() {
    const el = document.getElementById('intro'), v = el && el.querySelector('video');
    if (!el) { preloadCards(); showTitle(); return; }
    let done = false;
    const finish = split => {
      if (done) return; done = true;
      el.style.pointerEvents = 'none';
      showTitle(); preloadCards();   // 開いていく下で、もうタイトルが始まる
      if (reduceMotion) { el.remove(); return; }
      if (split && v.readyState >= 2) {
        // いまの画面（動画のコマ）を左右2枚に分けて、外へすべらせる
        const W = innerWidth, H = innerHeight, k = Math.max(W / v.videoWidth, H / v.videoHeight), dw = v.videoWidth * k, dh = v.videoHeight * k;
        const halves = [0, 1].map(side => {
          const d = document.createElement('div'); d.className = 'intro-half';
          const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
          const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(v, (W - dw) / 2, (H - dh) / 2, dw, dh);
          d.appendChild(cv); d.style.clipPath = side ? 'inset(0 0 0 50%)' : 'inset(0 50% 0 0)';
          document.body.appendChild(d); return d;
        });
        el.remove();
        halves.forEach((d, side) => d.animate([{ transform: 'none' }, { transform: `translateX(${side ? '' : '-'}${W * .55}px)` }],
          { duration: 700, easing: 'cubic-bezier(.75,0,.25,1)', fill: 'forwards' }).finished.then(() => d.remove(), () => d.remove()));
        return;
      }
      el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, easing: 'ease-out', fill: 'forwards' }).finished.then(() => el.remove(), () => el.remove());
    };
    if (reduceMotion) { finish(false); return; }
    v.addEventListener('ended', () => finish(true));
    v.addEventListener('error', () => finish(false));
    el.addEventListener('pointerdown', () => finish(true));   // タップで飛ばせる（そのタップで BGM も流れ始める）
    let started = false;
    const start = () => {
      if (started || done) return; started = true;
      requestAnimationFrame(() => requestAnimationFrame(() => { const p = v.play(); if (p) p.catch(() => finish(false)); }));   // 2コマ待って、画面が落ち着いてから
    };
    const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();
    const videoReady = new Promise(r => { if (v.readyState >= 4) r(); else v.addEventListener('canplaythrough', r, { once: true }); });
    Promise.all([fontsReady, videoReady]).then(start);
    setTimeout(start, 1500);                  // 待ちすぎない：1.5秒で始める
    setTimeout(() => finish(false), 7000);    // 念のため：何があっても7秒でタイトルへ
  })();
})();
</script>
